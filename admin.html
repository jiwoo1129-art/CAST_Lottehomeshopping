<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L.LIVE 관리자 편집</title><style>body{font:15px system-ui;background:#f5f7fb;color:#192e55;margin:0}header{background:#192e55;color:white;padding:25px 5%}main{max-width:950px;margin:20px auto;padding:0 15px}.card{background:white;border:1px solid #dfe6ef;border-radius:14px;padding:20px;margin:12px 0}input,textarea,select,button{font:inherit;border-radius:8px;padding:9px;border:1px solid #cbd5e1}textarea{width:95%;min-height:70px}button{background:#244d96;color:white;cursor:pointer}button.alt{background:#edf2f9;color:#19365b}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.item{display:flex;align-items:center;gap:8px;margin:7px 0}.item input[type=text]{flex:1;min-width:80px}.muted{color:#65758c}h1,h2,h3{margin:8px 0}a{color:#245bb5}</style><header><h1>L.LIVE 관리자 편집</h1><div>수정 후 data.json 다운로드 → GitHub에 업로드</div></header><main><div class="card"><strong>관리자 전용 사용 안내</strong><p class="muted">이 페이지는 비밀번호로 보호되지 않습니다. 관리자 링크를 공유하지 마세요. 공개 GitHub 저장소에서는 admin.html도 누구나 열 수 있습니다. 실제 게시 권한은 GitHub 저장소 권한으로 제한됩니다.</p><div class="row"><button id="add">+ 기업 추가</button><button id="export">게시용 data.json 다운로드</button><button class="alt" id="load">현재 게시된 데이터 불러오기</button><input id="import" type="file" accept=".json,application/json"></div><p>다운로드한 <b>data.json</b>을 <a href="https://github.com/jiwoo1129-art/CAST_Lottehomeshopping" target="_blank">GitHub 저장소</a>에 업로드하거나 기존 파일을 교체하면 팀원 화면에 반영됩니다.</p></div><div id="list"></div></main><script>const KEY='llive_owner_draft_v1',e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch{data=[]}if(!Array.isArray(data))data=[];function save(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){document.getElementById('list').innerHTML=data.map((c,i)=>`<div class="card" data-i="${i}"><div class="row"><h2>기업 ${i+1}</h2><button class="alt" data-act="remove">삭제</button></div><div class="row"><input data-f="name" placeholder="기업명" value="${e(c.name)}"><input data-f="contact" placeholder="담당자/연락처" value="${e(c.contact)}"><select data-f="status">${['컨택 예정','컨택 완료','회신 대기','회신 완료','협의 중','협업 확정','진행 보류','협업 불가'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></div><h3>기업 회신</h3><textarea data-f="reply" placeholder="회신 내용">${e(c.reply)}</textarea>${[['questions','기업 문의사항'],['discussions','우리 팀 논의사항']].map(([k,title])=>`<h3>${title}</h3>${(c[k]||[]).map((t,j)=>`<div class="item" data-kind="${k}" data-j="${j}"><input type="checkbox" data-t="done" ${t.done?'checked':''}><input type="text" data-t="text" value="${e(t.text)}"><button class="alt" data-act="removeTask">삭제</button></div>`).join('')}<button class="alt" data-act="addTask" data-kind="${k}">+ 항목 추가</button>`).join('')}</div>`).join('')||'<div class="card">기업 추가를 눌러 시작하세요.</div>'}document.getElementById('add').onclick=()=>{data.push({name:'',contact:'',status:'컨택 예정',reply:'',questions:[],discussions:[]});save();render()};document.getElementById('list').addEventListener('input',ev=>{const card=ev.target.closest('[data-i]');if(!card)return;const c=data[+card.dataset.i],field=ev.target.dataset.f;if(field)c[field]=ev.target.value;else if(ev.target.dataset.t){const item=ev.target.closest('[data-j]');c[item.dataset.kind][+item.dataset.j][ev.target.dataset.t]=ev.target.type==='checkbox'?ev.target.checked:ev.target.value}save()});document.getElementById('list').addEventListener('change',ev=>{if(ev.target.type==='checkbox'||ev.target.dataset.f==='status')ev.target.dispatchEvent(new Event('input',{bubbles:true}))});document.getElementById('list').addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const card=b.closest('[data-i]'),i=+card.dataset.i,c=data[i];if(b.dataset.act==='remove'){if(!confirm('기업을 삭제할까요?'))return;data.splice(i,1)}if(b.dataset.act==='addTask')c[b.dataset.kind].push({text:'',done:false});if(b.dataset.act==='removeTask'){const item=b.closest('[data-j]');c[item.dataset.kind].splice(+item.dataset.j,1)}save();render()});document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('load').onclick=async()=>{if(data.length&&!confirm('현재 편집 중인 내용을 게시된 데이터로 덮어쓸까요?'))return;try{const r=await fetch('./data.json?t='+Date.now());if(!r.ok)throw Error();const v=await r.json();if(!Array.isArray(v))throw Error();data=v;save();render()}catch{alert('게시된 data.json을 불러오지 못했습니다.')}};document.getElementById('import').onchange=async ev=>{try{const v=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(v))throw Error();data=v;save();render()}catch{alert('올바른 JSON 파일이 아닙니다.')}};render();</script></html>
