<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L.LIVE | 기업 컨택 보드</title><style>body{margin:0;background:#f5f7fb;color:#18243a;font:15px system-ui,sans-serif}header{background:#182b52;color:white;padding:24px max(20px,calc((100vw - 1080px)/2))}h1{margin:0 0 6px}main{max-width:1080px;margin:26px auto;padding:0 16px}.panel,.company{background:white;border:1px solid #e3e8f0;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 15px #17223b09}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}input,textarea,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #cbd4e2;box-sizing:border-box}input,textarea{width:100%}textarea{min-height:75px}button{background:#244d99;color:white;border:0;cursor:pointer}button.secondary{background:#eef2f9;color:#203453}button.danger{background:#fff0f0;color:#a83232}button:disabled{opacity:.5}label{font-size:13px;color:#516078}small,.muted{color:#69788c}header small{color:#d4e1ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.item{border:1px solid #e4e9f1;border-radius:10px;padding:10px;margin:8px 0}.item.done{opacity:.55}.item label{display:flex;gap:9px;align-items:flex-start;font-size:15px;color:#26354c}.item input{width:auto}.tag{font-size:12px;background:#e9effc;padding:5px 9px;border-radius:20px}h3{margin:18px 0 8px}#notice{color:#a83232}#board[hidden],#login[hidden]{display:none} .actions{margin-top:8px} .actions button{padding:7px 10px} .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}</style></head><body><header><h1>L.LIVE Contact Hub</h1><small>롯데홈쇼핑 대학대전 · 기업 컨택 & 팀 논의 관리</small></header><main><section class="panel" id="login"><h2>팀원 로그인</h2><p class="muted">허용된 팀원 이메일로 로그인 링크를 받아 접속하세요.</p><div class="row"><input class="grow" id="email" type="email" placeholder="team@example.com" style="min-width:220px"><button id="send">로그인 링크 발송</button></div><p id="loginMessage"></p></section><div id="board" hidden><div class="panel top"><div><strong id="who"></strong><p class="muted" style="margin:5px 0">변경사항은 팀원에게 실시간 반영됩니다.</p></div><button class="secondary" id="logout">로그아웃</button></div><section class="panel"><h2>기업 등록</h2><div class="grid"><input id="companyName" placeholder="기업명 *"><input id="contact" placeholder="담당자 / 연락처"><select id="status"><option>컨택 예정</option><option>컨택 완료</option><option>회신 대기</option><option>회신 완료</option><option>협의 중</option><option>협업 확정</option><option>진행 보류</option></select></div><p><textarea id="reply" placeholder="기업 회신 내용 (선택)"></textarea></p><button id="addCompany">기업 등록</button></section><section class="panel"><div class="row"><input class="grow" id="search" placeholder="기업명 검색" style="min-width:180px"><span id="summary" class="muted"></span></div></section><div id="companies"></div></div><p id="notice"></p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// 배포 전 config.js 파일에 Supabase 프로젝트 URL과 publishable/anon key를 설정하세요.
import {SUPABASE_URL,SUPABASE_ANON_KEY} from './config.js';
const $=id=>document.getElementById(id); const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let user=null,companies=[],tasks=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=s=>{$('notice').textContent=s;setTimeout(()=>{$('notice').textContent=''},5000)};
async function load(){let [a,b]=await Promise.all([db.from('companies').select('*').order('created_at',{ascending:false}),db.from('tasks').select('*').order('created_at')]);if(a.error||b.error){msg(a.error?.message||b.error?.message);return}companies=a.data;tasks=b.data;render()}
function render(){let q=$('search').value.toLowerCase();let arr=companies.filter(c=>c.name.toLowerCase().includes(q));$('summary').textContent=`전체 ${companies.length}개 기업 · 미완료 ${tasks.filter(t=>!t.done).length}건`;$('companies').innerHTML=arr.map(c=>{let ts=tasks.filter(t=>t.company_id===c.id);return `<article class="company"><div class="top"><div><h2 style="margin:0">${esc(c.name)}</h2><small>${esc(c.contact)}</small></div><span class="tag">${esc(c.status)}</span></div><h3>진행 상태</h3><div class="row"><select data-status="${c.id}">${['컨택 예정','컨택 완료','회신 대기','회신 완료','협의 중','협업 확정','진행 보류'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select><button class="danger" data-delete-company="${c.id}">기업 삭제</button></div><h3>기업 회신 내용</h3><textarea data-reply="${c.id}" placeholder="기업 회신 내용을 기록하세요">${esc(c.reply)}</textarea><div class="actions"><button data-save-reply="${c.id}">회신 저장</button></div>${[['question','기업 문의사항'],['discussion','우리 팀 논의사항']].map(([kind,title])=>`<h3>${title} (${ts.filter(t=>t.kind===kind&&t.done).length}/${ts.filter(t=>t.kind===kind).length})</h3>${ts.filter(t=>t.kind===kind).map(t=>`<div class="item ${t.done?'done':''}"><label><input type="checkbox" data-check="${t.id}" ${t.done?'checked':''}><span class="grow">${esc(t.content)}</span></label><div class="actions"><button class="danger" data-delete-task="${t.id}">삭제</button></div></div>`).join('')}<div class="row"><input class="grow" data-input="${c.id}:${kind}" placeholder="새 항목 입력" style="min-width:180px"><button data-add-task="${c.id}:${kind}">추가</button></div>`).join('')}</article>`}).join('')||'<div class="panel muted">등록된 기업이 없습니다.</div>'}
$('send').onclick=async()=>{let email=$('email').value.trim();if(!email)return;let {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});$('loginMessage').textContent=error?error.message:'이메일의 로그인 링크를 확인하세요.'};
$('logout').onclick=()=>db.auth.signOut();$('search').oninput=render;
$('addCompany').onclick=async()=>{let name=$('companyName').value.trim();if(!name)return msg('기업명을 입력하세요');let {error}=await db.from('companies').insert({name,contact:$('contact').value,status:$('status').value,reply:$('reply').value});if(error)return msg(error.message);['companyName','contact','reply'].forEach(x=>$(x).value='');await load()};
$('companies').onchange=async e=>{let t=e.target;if(t.dataset.check){let {error}=await db.from('tasks').update({done:t.checked}).eq('id',t.dataset.check);if(error)msg(error.message);await load()}if(t.dataset.status){let {error}=await db.from('companies').update({status:t.value}).eq('id',t.dataset.status);if(error)msg(error.message);await load()}};
$('companies').onclick=async e=>{let d=e.target.dataset;if(d.addTask){let [company_id,kind]=d.addTask.split(':'),input=[...document.querySelectorAll('[data-input]')].find(x=>x.dataset.input===d.addTask),content=input.value.trim();if(!content)return;let {error}=await db.from('tasks').insert({company_id,kind,content});if(error)msg(error.message);await load()}if(d.saveReply){let reply=document.querySelector(`[data-reply="${d.saveReply}"]`).value;let {error}=await db.from('companies').update({reply}).eq('id',d.saveReply);if(error)msg(error.message);else msg('회신 내용 저장 완료');await load()}if(d.deleteTask&&confirm('이 항목을 삭제할까요?')){let {error}=await db.from('tasks').delete().eq('id',d.deleteTask);if(error)msg(error.message);await load()}if(d.deleteCompany&&confirm('기업과 관련 항목을 모두 삭제할까요?')){let {error}=await db.from('companies').delete().eq('id',d.deleteCompany);if(error)msg(error.message);await load()}};
let channel=db.channel('llive-updates').on('postgres_changes',{event:'*',schema:'public',table:'companies'},()=>load()).on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>load()).subscribe();
db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;$('login').hidden=!!user;$('board').hidden=!user;if(user){$('who').textContent=user.email;setTimeout(load,0)}});
</script></body></html>
