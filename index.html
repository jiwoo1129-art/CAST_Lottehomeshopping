<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L.LIVE 기업 컨택 현황</title><style>body{font:15px system-ui;background:#f5f7fb;color:#182b49;margin:0}header{background:#192e55;color:white;padding:28px 5%}main{max-width:960px;margin:25px auto;padding:0 16px}.card{background:white;padding:20px;margin:14px 0;border-radius:14px;border:1px solid #e1e6ee}h1,h2{margin:4px 0 12px}small{color:#aabbd8}.item{padding:8px 0;border-bottom:1px solid #eee}a{color:#245bb5}.pill{background:#e7edf8;padding:5px 9px;border-radius:20px;font-size:12px}.muted{color:#63758c}pre{white-space:pre-wrap;font:inherit}</style><header><h1>L.LIVE 기업 컨택 현황</h1><small>롯데홈쇼핑 대학대전 · 팀원 조회용</small></header><main><div id="root" class="card">데이터를 불러오는 중...</div></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./data.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error('파일 없음');return r.json()}).then(data=>{const a=Array.isArray(data)?data:[];document.getElementById('root').outerHTML=a.length?a.map(c=>`<article class="card"><h2>${e(c.name)} <span class="pill">${e(c.status)}</span></h2><p class="muted">${e(c.contact)}</p><h3>기업 회신</h3><pre>${e(c.reply)||'등록된 회신 없음'}</pre>${[['questions','기업 문의사항'],['discussions','내부 논의사항']].map(([key,title])=>`<h3>${title}</h3>${(c[key]||[]).map(t=>`<div class="item">${t.done?'☑':'☐'} ${e(t.text)}</div>`).join('')||'<p class="muted">등록된 항목 없음</p>'}`).join('')}</article>`).join(''):'<div class="card">아직 등록된 기업이 없습니다.</div>'}).catch(()=>document.getElementById('root').textContent='data.json을 불러오지 못했습니다. GitHub에 data.json을 올려 주세요.');</script></html>
